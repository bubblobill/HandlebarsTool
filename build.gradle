plugins {
    id 'java'
    id 'base'
    id 'idea'
//    id("com.gradleup.shadow") version("9.3.0")
    id 'application'
    id 'distribution'
    id("org.beryx.jlink") version "3.2.0"
}

repositories {
    gradlePluginPortal()
    mavenLocal()
    mavenCentral()
    maven { url = "https://www.jetbrains.com/intellij-repository/releases" }
    maven { url = "https://cache-redirector.jetbrains.com/intellij-dependencies" }
    maven { url = "https://oss.sonatype.org/content/repositories/snapshots" }
}

group = 'net.rptools'
version = '0.a'

application {
    mainClass = 'net.rptools.Main'
    applicationName = 'HandlebarsTool'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

configurations {
    antTask
}

dependencies {

    implementation("org.beryx.jlink:org.beryx.jlink.gradle.plugin:3.2.0")
//    implementation("com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:9.3.0")

    implementation 'com.github.jknack:handlebars-proto:4.3.1'
    implementation 'com.github.jknack:handlebars-helpers:4.3.1'

    implementation 'org.jsoup:jsoup:1.21.2'

    implementation 'com.jetbrains.intellij.java:java-gui-forms-rt:241.12019'
    antTask 'com.jetbrains.intellij.java:java-compiler-ant-tasks:233.14475.56'

    implementation 'org.apache.logging.log4j:log4j-core:2.25.3'
    implementation 'org.apache.logging.log4j:log4j-api:2.25.3'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.25.3'
}
jar {
    manifest {
        attributes 'Main-Class': 'net.rptools.Main'
    }
}
//shadowJar {
//    manifest {
//        attributes 'Main-Class': 'net.rptools.Main'
//    }
//}
jlink {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages', "--output myruntime"]
    launcher{
        name = 'HandlebarsTool'
        jvmArgs = ['-Dlog4j.configurationFile=./log4j2.xml']
    }
}
tasks.register('createWrapper', Wrapper) {
    gradleVersion = '9.0.0'
}
